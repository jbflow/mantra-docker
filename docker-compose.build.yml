# Build from GitHub sources - for use on any machine
# When you only have mantra-docker cloned
# This clones each repo into a temporary build context and builds

version: '3.9'

services:
  protocol:
    build:
      context: .
      dockerfile: Dockerfile.github
      args:
        REPO: "musical-intent-protocol"
        GIT_URL: "https://github.com/jbflow/musical-intent-protocol.git"
    image: mantra-protocol:latest
    container_name: mantra-protocol
    networks:
      - mantra-network
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  engine:
    build:
      context: .
      dockerfile: Dockerfile.github
      args:
        REPO: "mantra-engine"
        GIT_URL: "https://github.com/jbflow/mantra-engine.git"
    image: mantra-engine:latest
    container_name: mantra-engine
    networks:
      - mantra-network
    ports:
      - "3001:3000"
    depends_on:
      protocol:
        condition: service_healthy
    environment:
      - MIP_PROTOCOL_URL=http://protocol:3000
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    command: ["npm", "run", "test"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.github
      args:
        REPO: "mantra-fe"
        GIT_URL: "https://github.com/jbflow/mantra-fe.git"
    image: mantra-fe:latest
    container_name: mantra-frontend
    networks:
      - mantra-network
    ports:
      - "3002:3000"
    depends_on:
      engine:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=http://engine:3000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  remote-script:
    build:
      context: .
      dockerfile: Dockerfile.github
      args:
        REPO: "mantra-remote-script"
        GIT_URL: "https://github.com/jbflow/mantra-remote-script.git"
    image: mantra-remote-script:latest
    container_name: mantra-remote-script
    networks:
      - mantra-network
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('localhost', 9001)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  mantra-network:
    driver: bridge

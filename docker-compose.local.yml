version: '3.9'

services:
  protocol:
    build:
      context: ../musical-intent-protocol
      dockerfile: Dockerfile
    container_name: mantra-protocol-dev
    networks:
      - mantra-network
    ports:
      - "3000:3000"
    volumes:
      - ../musical-intent-protocol/src:/app/src
      - ../musical-intent-protocol/schema:/app/schema

  engine:
    build:
      context: ../mantra-engine
      dockerfile: Dockerfile
    container_name: mantra-engine-dev
    networks:
      - mantra-network
    ports:
      - "3001:3000"
    volumes:
      - ../mantra-engine/src:/app/src
      - ../mantra-engine/tests:/app/tests
    depends_on:
      - protocol
    environment:
      - MIP_PROTOCOL_URL=http://protocol:3000

  frontend:
    build:
      context: ../mantra-fe
      dockerfile: Dockerfile
    container_name: mantra-frontend-dev
    networks:
      - mantra-network
    ports:
      - "3002:3000"
    volumes:
      - ../mantra-fe/app:/app/app
      - ../mantra-fe/src:/app/src
    depends_on:
      - engine
    environment:
      - NEXT_PUBLIC_API_URL=http://engine:3000

  remote-script:
    build:
      context: ../mantra-remote-script
      dockerfile: Dockerfile
    container_name: mantra-remote-script-dev
    networks:
      - mantra-network
    ports:
      - "9001:9001"
    volumes:
      - ../mantra-remote-script:/app
    depends_on:
      - liveapi-mock

  liveapi-mock:
    build:
      context: ../LiveAPI-mock
      dockerfile: Dockerfile
    container_name: mantra-liveapi-mock-dev
    networks:
      - mantra-network
    ports:
      - "9999:9999"
    volumes:
      - ../LiveAPI-mock/live:/app/live
      - ../LiveAPI-mock/tests:/app/tests
    command: ["python", "-c", "from live import Song; print('✅ LiveAPI-mock service running'); import time; time.sleep(999999)"]

networks:
  mantra-network:
    driver: bridge

version: '3.9'

services:
  protocol:
    build:
      context: ../musical-intent-protocol
      dockerfile: Dockerfile
    container_name: mantra-protocol-dev
    networks:
      - mantra-network
    ports:
      - "3000:3000"
    volumes:
      - ../musical-intent-protocol:/app

  engine:
    build:
      context: ../mantra-engine
      dockerfile: Dockerfile
    container_name: mantra-engine-dev
    networks:
      - mantra-network
    ports:
      - "3001:3000"
    volumes:
      - ../mantra-engine:/app
      - ../mantra-engine/node_modules:/app/node_modules
    depends_on:
      - protocol
    environment:
      - MIP_PROTOCOL_URL=http://protocol:3000

  frontend:
    build:
      context: ../mantra-fe
      dockerfile: Dockerfile
    container_name: mantra-frontend-dev
    networks:
      - mantra-network
    ports:
      - "3002:3000"
    volumes:
      - ../mantra-fe:/app
      - ../mantra-fe/node_modules:/app/node_modules
    depends_on:
      - engine
    environment:
      - NEXT_PUBLIC_API_URL=http://engine:3000

  remote-script:
    build:
      context: ../mantra-remote-script
      dockerfile: Dockerfile
    container_name: mantra-remote-script-dev
    networks:
      - mantra-network
    ports:
      - "9001:9001"
    volumes:
      - ../mantra-remote-script:/app

networks:
  mantra-network:
    driver: bridge
